name: Build Standalone jmkvpropedit AppImage

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 jq curl wget

      - name: Create AppDir Structure
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/lib AppDir/jre

      - name: Download and Extract jmkvpropedit
        run: |
          # 1. Download the zip file from the latest release
          gh release download --repo BrunoReX/jmkvpropedit --pattern "*.zip" --output release.zip
          
          # 2. Unzip it into a temporary folder
          unzip release.zip -d temp_extracted
          
          # 3. Find the .jar file inside that folder and move it to AppDir
          # We use find because the jar might be inside a subfolder in the zip
          find temp_extracted -name "*.jar" -exec cp {} AppDir/jmkvpropedit.jar \;
          
          # 4. Cleanup
          rm release.zip
          rm -rf temp_extracted
          
          # 5. Verify success
          if [ ! -f AppDir/jmkvpropedit.jar ]; then echo "Error: JAR file not found in zip!"; exit 1; fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Portable Linux Java (JRE 17)
        run: |
          wget "https://api.adoptium.net/v3/binary/latest/17/ga/linux/x64/jre/hotspot/normal/eclipse" -O jre.tar.gz
          tar -xzf jre.tar.gz -C AppDir/jre --strip-components=1

      - name: Bundle mkvpropedit (from MKVToolNix)
        run: |
          # 1. Get the direct URL for the latest x86_64 AppImage
          # This looks for the first link ending in -x86_64.AppImage that isn't a "zsync" file
          MKV_URL=$(curl -s https://mkvtoolnix.download/appimage/ | grep -oP 'href="\K[^"]*x86_64\.AppImage(?!"|.*zsync)' | head -n 1)
          
          echo "Downloading MKVToolNix from: https://mkvtoolnix.download/appimage/$MKV_URL"
          
          # 2. Download the ACTUAL file (not the html page)
          wget "https://mkvtoolnix.download/appimage/$MKV_URL" -O mkvtoolnix.AppImage
          
          # 3. Extract it
          chmod +x mkvtoolnix.AppImage
          ./mkvtoolnix.AppImage --appimage-extract
          
          # 4. Copy the binary and its required libraries into our AppDir
          cp squashfs-root/usr/bin/mkvpropedit AppDir/usr/bin/
          cp -P squashfs-root/usr/lib/*.so* AppDir/usr/lib/ || true
          
          # Clean up
          rm -rf squashfs-root mkvtoolnix.AppImage

      - name: Create Execution Script (AppRun)
        run: |
          cat << 'EOF' > AppDir/AppRun
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          
          # Point the system to our bundled Java
          export JAVA_HOME="$HERE/jre"
          
          # Add bundled Java and bundled mkvpropedit to the system PATH
          export PATH="$HERE/usr/bin:$JAVA_HOME/bin:$PATH"
          
          # Point the system to the bundled MKVToolNix libraries
          export LD_LIBRARY_PATH="$HERE/usr/lib:$LD_LIBRARY_PATH"
          
          # Launch the GUI
          exec java -jar "$HERE/jmkvpropedit.jar" "$@"
          EOF
          chmod +x AppDir/AppRun

      - name: Create Linux Desktop Shortcut Data
        run: |
          cat << 'EOF' > AppDir/jmkvpropedit.desktop
          [Desktop Entry]
          Type=Application
          Name=jmkvpropedit
          Comment=Batch GUI for mkvpropedit (Standalone)
          Exec=AppRun
          Icon=jmkvpropedit
          Categories=AudioVideo;
          Terminal=false
          EOF

      - name: Download App Icon
        run: |
          wget "https://raw.githubusercontent.com/jlesage/docker-templates/master/jlesage/images/jmkvpropedit-icon.png" -O AppDir/jmkvpropedit.png

      - name: Compile the Final AppImage
        run: |
          wget "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage AppDir jmkvpropedit-Standalone-x86_64.AppImage

      - name: Upload Final AppImage
        uses: actions/upload-artifact@v4
        with:
          name: jmkvpropedit-Standalone-AppImage
          path: jmkvpropedit-Standalone-x86_64.AppImage
